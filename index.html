<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jod Master – Add Game</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c4dff">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#7c4dff;--bg2:#ff6ec7;--card:#fff;--ink:#2b1b5a;--ok:#2ecc71;--bad:#ff5a5f;--gold:#ffc83d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1a6e;--bg2:#6a1b6f;--card:#2d2358;--ink:#fff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden}
.screen{display:none;max-width:560px;margin:0 auto;padding:16px;min-height:100%}
.screen.on{display:block}
h1{color:#fff;text-align:center;font-size:2.2rem;margin:8px 0 0;text-shadow:0 4px 0 rgba(0,0,0,.2)}
.sub{color:#fff;text-align:center;margin:0 0 14px;opacity:.95}
.lion{font-size:4rem;text-align:center;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lv{background:var(--card);color:var(--ink);border:0;border-radius:18px;padding:10px 4px;font:800 1.5rem "Baloo 2",system-ui;box-shadow:0 6px 0 rgba(0,0,0,.2);cursor:pointer;transition:transform .1s}
.lv:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.lv small{display:block;font-size:.85rem;color:#e6a100;letter-spacing:1px;min-height:1.2em}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{background:rgba(255,255,255,.3);border:0;color:#fff;font-size:1.4rem;border-radius:14px;padding:4px 12px;cursor:pointer}
.bar{flex:1;height:18px;background:rgba(255,255,255,.3);border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ff9f1c);border-radius:20px;transition:width .4s}
.cnt{color:#fff;font-weight:800}
.q{background:var(--card);border-radius:28px;padding:20px 10px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.2);margin:10px 0 16px}
.q .eq{font-size:clamp(2.6rem,13vw,4.2rem);font-weight:800;line-height:1.1}
.q .eq b{color:#ff4fa3}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode{border:0;border-radius:26px;padding:20px 6px;color:#fff;font:800 1.5rem "Baloo 2",system-ui;box-shadow:0 8px 0 rgba(0,0,0,.25);cursor:pointer}
.mode span{display:block;font-size:3.2rem}
.mode:active{transform:translateY(5px)}
.vis{font-size:1.6rem;line-height:1.25;margin-bottom:6px;word-break:break-all}
.vis .x{opacity:.25;filter:grayscale(1)}
.vis .g{display:inline-block;border:2px dashed #b9a6ff;border-radius:12px;padding:0 4px;margin:2px}
.msg{min-height:1.8em;color:#fff;text-align:center;font-weight:800;font-size:1.3rem;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.op{border:0;border-radius:22px;padding:18px 0;font:800 2.2rem "Baloo 2",system-ui;color:#fff;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.25);transition:transform .1s}
.op:nth-child(1){background:#00b4d8}.op:nth-child(2){background:#ff9f1c}.op:nth-child(3){background:#9b5de5}.op:nth-child(4){background:#06d6a0}
.op:active{transform:translateY(5px)}
.op.right{background:var(--ok);animation:pop .5s}
.op.wrong{background:var(--bad);animation:shake .4s;opacity:.55}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#end{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#fff;padding:20px;background:radial-gradient(circle at 50% 35%,#5b2bd6 0,#14082f 70%);overflow:hidden}
#end.on{display:flex;animation:fade 1s}
@keyframes fade{from{opacity:0}}
.beam{position:absolute;top:-10%;left:50%;width:140vmax;height:140vmax;margin-left:-70vmax;background:conic-gradient(from 0deg,rgba(255,220,100,.28),transparent 10%,rgba(255,220,100,.28) 20%,transparent 30%,rgba(255,220,100,.28) 40%,transparent 50%,rgba(255,220,100,.28) 60%,transparent 70%,rgba(255,220,100,.28) 80%,transparent 90%);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#end>*{position:relative}
.trophy{font-size:7rem;animation:drop 1.2s cubic-bezier(.2,1.6,.4,1) both,bob 2s 1.2s infinite}
@keyframes drop{from{transform:translateY(-120vh) scale(.3)}}
.big{font-size:clamp(2.4rem,11vw,4rem);font-weight:800;color:var(--gold);text-shadow:0 0 30px #ff9f1c;margin:0}
.big span{display:inline-block;opacity:0;animation:letter .5s forwards}
@keyframes letter{from{opacity:0;transform:translateY(40px) scale(.3)}to{opacity:1;transform:none}}
.stars{font-size:3rem;letter-spacing:6px}
.stars s{text-decoration:none;display:inline-block;opacity:0;animation:star .6s forwards}
@keyframes star{from{opacity:0;transform:scale(0) rotate(-180deg)}to{opacity:1;transform:none}}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.btns button{border:0;border-radius:18px;padding:12px 20px;font:800 1.2rem "Baloo 2",system-ui;background:#fff;color:#2b1b5a;box-shadow:0 5px 0 rgba(0,0,0,.3);cursor:pointer}
.btns button.pri{background:var(--gold)}
.fly{position:fixed;pointer-events:none;z-index:30}
.balloon{font-size:3.2rem;bottom:-80px;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-120vh) rotate(15deg)}}
.conf{top:-20px;width:10px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.mode.wide{grid-column:1/-1}
.vis.mid{font-size:2.5rem;line-height:1.3}
.nn{font-size:2.1rem;font-weight:800;margin:0 5px;color:#ff4fa3;display:inline-block}
.mini{display:inline-block;vertical-align:middle;margin:2px}
.vis .mini svg{width:100%;height:auto;margin:0;display:block}
.vis .wide svg{width:min(94%,340px)}
.vis .row{font-size:1.5rem;text-align:left;padding:0 8px;line-height:1.35}
.eq.txt{font-size:clamp(1.25rem,5.6vw,1.8rem);line-height:1.3}
.vis svg{width:min(50vw,180px);height:auto;display:block;margin:0 auto}
.vis.big{font-size:5.2rem;line-height:1.1}
.op.txt{font-size:1.5rem;padding:12px 4px}
.op small{display:block;font-size:.9rem;font-weight:600;opacity:.95}
</style>
</head>
<body>
<div id="home" class="screen on">
  <div class="lion">🦁</div>
  <h1>Jod Master!</h1>
  <p class="sub">Aaj kya seekhna hai? 🌈</p>
  <div class="modes" id="modes"></div>
</div>

<div id="lvls" class="screen">
  <div class="top"><button class="back" id="lback">🏠</button><h2 id="ltitle" style="color:#fff;margin:0;flex:1;text-align:center"></h2></div>
  <div class="grid" id="grid"></div>
</div>

<div id="game" class="screen">
  <div class="top"><button class="back" id="back">🏠</button><div class="bar"><i id="fill"></i></div><div class="cnt" id="cnt">1/20</div><button class="back" id="vbtn">🔊</button></div>
  <div class="q"><div class="vis" id="vis"></div><div class="eq" id="eq"></div></div>
  <div class="msg" id="msg"></div>
  <div class="opts" id="opts"></div>
</div>

<div id="end">
  <div class="beam"></div>
  <div class="trophy">🏆</div>
  <h2 class="big" id="big"></h2>
  <div class="stars" id="stars"></div>
  <p id="score" style="font-size:1.4rem;font-weight:800;margin:6px 0"></p>
  <div class="btns" id="ebtns"></div>
</div>

const okA=new Audio(SND.ok),badA=SND.bad.map(x=>new Audio(x));
let lastBad=-1,okT=0;
function playOk(full){try{okA.currentTime=0;okA.volume=.9;okA.play();clearTimeout(okT);if(!full)okT=setTimeout(()=>okA.pause(),1800)}catch(e){}}
function playBad(){try{let k;do{k=Math.floor(Math.random()*badA.length)}while(k===lastBad&&badA.length>1);lastBad=k;const a=badA[k];a.currentTime=0;a.volume=1;a.play()}catch(e){}}
const sfx={ok:()=>playOk(false),bad:playBad,win:()=>playOk(true),tap:()=>{}};
let voiceOn=true,VO=null;
function pickVoice(){const v=speechSynthesis.getVoices();VO=v.find(x=>x.lang==="hi-IN")||v.find(x=>/^hi/i.test(x.lang))||v.find(x=>x.lang==="en-IN")||null}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function say(t,pitch,delay){if(!voiceOn)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="hi-IN";if(VO)u.voice=VO;u.pitch=pitch||1.7;u.rate=.95;setTimeout(()=>speechSynthesis.speak(u),delay||120)}catch(e){}}

let mode="add",n=1,list=[],i=0,score=0,tried=false,locked=false,emo="🍦";
function start(m,num){
  mode=m;n=num;i=0;score=0;
  if(CHP[m])list=CHP[m].pool(num);else{
  const seq=[...Array(20).keys()].map(x=>x+1);
  list=m==="tab"?seq:m==="sub"?seq.map(x=>x-1+n):seq;
  if(m!=="tab")list.sort(()=>Math.random()-.5);}
  $("end").classList.remove("on");show("game");ask();
}

function pick(b,v,ans){
  if(locked||b.classList.contains("wrong"))return;
  if(v===ans){
    locked=true;if(!tried)score++;
    b.classList.add("right");sfx.ok();
    $("msg").textContent=praise[Math.floor(Math.random()*praise.length)]+(CHP[mode]&&list[i].fx?" "+list[i].fx:"");
    sparkle(b);
    setTimeout(()=>{i++;i<20?ask():finish()},CHP[mode]?2300:1000);
  }else{
    tried=true;b.classList.add("wrong");sfx.bad();
    $("msg").textContent=retry[Math.floor(Math.random()*retry.length)];
  }
}
function sparkle(el){
  const r=el.getBoundingClientRect();
  for(let k=0;k<14;k++){
    const c=document.createElement("div");c.className="fly conf";
    c.style.left=(r.left+r.width/2+(Math.random()*80-40))+"px";c.style.top=r.top+"px";
    c.style.background=["#ffc83d","#ff6ec7","#00b4d8","#2ecc71"][k%4];
    c.style.animationDuration=(.8+Math.random()*.8)+"s";
    document.body.appendChild(c);setTimeout(()=>c.remove(),1800);
  }
}

  $("stars").innerHTML=[1,2,3].map(k=>"<s style=\"animation-delay:"+(1.8+k*.4)+"s\">"+(k<=st?"⭐":"☆")+"</s>").join("");
